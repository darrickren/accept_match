[theme]
base = "light"
primaryColor = "#1d1d1f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
linkColor = "#0066cc"
borderColor = "#d2d2d7"
font = "system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
headingFont = "system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
baseRadius = "0.75rem"
buttonRadius = "full"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 10

[browser]
gatherUsageStats = false
